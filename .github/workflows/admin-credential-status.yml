name: Admin credential status

on:
  workflow_dispatch:

jobs:
  credential-status:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://oshireader.onrender.com
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
    steps:
      - name: Check required secret
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Read credential status
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ["BACKEND_URL"].rstrip("/") + "/api/credentials/"
          req = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {os.environ['ADMIN_API_TOKEN']}"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
