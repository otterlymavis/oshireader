name: Admin credential status

on:
  workflow_dispatch:

jobs:
  credential-status:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://oshireader.onrender.com
    steps:
      - name: Check required secret
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Read credential status
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = os.environ["BACKEND_URL"].rstrip("/") + "/api/credentials/"
          req = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {os.environ['ADMIN_API_TOKEN']}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Credential status returned HTTP {exc.code}") from None
          except urllib.error.URLError:
              raise SystemExit("Credential status request failed") from None

          if not isinstance(payload, list):
              raise SystemExit("Credential status returned a non-list payload")
          summary = []
          for credential in payload:
              if not isinstance(credential, dict):
                  raise SystemExit("Credential status returned an invalid entry")
              platform = credential.get("platform")
              if platform not in {"youtube", "twitter"}:
                  raise SystemExit("Credential status returned an unknown platform")
              summary.append({
                  "platform": platform,
                  "has_bearer_token": credential.get("has_bearer_token") is True,
                  "has_api_key": credential.get("has_api_key") is True,
                  "has_api_secret": credential.get("has_api_secret") is True,
              })
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
