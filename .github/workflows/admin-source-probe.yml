name: Admin source probe

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Keyword to probe
        required: true
        default: 吉沢亮
      platform:
        description: Platform id
        required: true
        default: twitter

jobs:
  source-probe:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://oshireader.onrender.com
      KEYWORD: ${{ inputs.keyword }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - name: Check required secret
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Run admin source probe
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          params = {
              "keyword": os.environ["KEYWORD"],
              "platform": os.environ["PLATFORM"],
          }
          url = os.environ["BACKEND_URL"].rstrip() + "/api/admin/source-probe?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['ADMIN_API_TOKEN']}"})
          try:
              with urllib.request.urlopen(req, timeout=75) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Admin source probe returned HTTP {exc.code}") from None
          except urllib.error.URLError:
              raise SystemExit("Admin source probe request failed") from None

          if not isinstance(payload, dict):
              raise SystemExit("Admin source probe returned a non-object payload")

          def source_summary(key):
              result = payload.get(key)
              if not isinstance(result, dict):
                  raise SystemExit(f"Admin source probe returned invalid {key} diagnostics")
              summary = {"error_present": bool(result.get("error"))}
              for field in ("status", "bytes", "entries", "keyword_title_matches"):
                  value = result.get(field)
                  if value is not None and (
                      isinstance(value, bool) or not isinstance(value, int) or value < 0
                  ):
                      raise SystemExit(f"Admin source probe returned invalid {key} {field}")
                  summary[field] = value
              return summary

          summary = {
              key: source_summary(key)
              for key in ("direct", "jina", "bing", "worker_proxy", "worker_proxy_bing")
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
