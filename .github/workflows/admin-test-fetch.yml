name: Admin test fetch

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Keyword to fetch
        required: true
        default: 吉沢亮
      platform:
        description: Optional platform id
        required: false
        default: 5ch
      samples:
        description: Number of sample items to print
        required: false
        default: "3"

jobs:
  test-fetch:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://oshireader.onrender.com
      KEYWORD: ${{ inputs.keyword }}
      PLATFORM: ${{ inputs.platform }}
      SAMPLES: ${{ inputs.samples }}
    steps:
      - name: Check required secret
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Run admin test fetch
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          params = {
              "keyword": os.environ["KEYWORD"],
              "samples": os.environ.get("SAMPLES") or "0",
              "timeout_seconds": "45",
          }
          platform = os.environ.get("PLATFORM", "").strip()
          if platform:
              params["platform"] = platform
          url = os.environ["BACKEND_URL"].rstrip("/") + "/api/admin/test-fetch?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['ADMIN_API_TOKEN']}"})
          try:
              with urllib.request.urlopen(req, timeout=75) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Admin test fetch returned HTTP {exc.code}") from None
          except urllib.error.URLError:
              raise SystemExit("Admin test fetch request failed") from None

          if not isinstance(payload, dict):
              raise SystemExit("Admin test fetch returned a non-object payload")
          counts = {}
          for source, result in payload.items():
              if isinstance(result, dict):
                  raw_count = result.get("count")
              else:
                  raw_count = result
              if isinstance(raw_count, bool) or not isinstance(raw_count, int) or raw_count < 0:
                  raise SystemExit("Admin test fetch returned an invalid source count")
              counts[str(source)] = raw_count
          print(json.dumps({"source_counts": counts}, ensure_ascii=False, indent=2))
          PY
