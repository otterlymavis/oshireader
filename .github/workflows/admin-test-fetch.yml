name: Admin test fetch

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Keyword to fetch
        required: true
        default: 吉沢亮
      platform:
        description: Optional platform id
        required: false
        default: 5ch
      samples:
        description: Number of sample items to print
        required: false
        default: "3"

jobs:
  test-fetch:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://oshireader.onrender.com
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      KEYWORD: ${{ inputs.keyword }}
      PLATFORM: ${{ inputs.platform }}
      SAMPLES: ${{ inputs.samples }}
    steps:
      - name: Check required secret
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Run admin test fetch
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          params = {
              "keyword": os.environ["KEYWORD"],
              "samples": os.environ.get("SAMPLES") or "0",
              "timeout_seconds": "45",
          }
          platform = os.environ.get("PLATFORM", "").strip()
          if platform:
              params["platform"] = platform
          url = os.environ["BACKEND_URL"].rstrip("/") + "/api/admin/test-fetch?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['ADMIN_API_TOKEN']}"})
          with urllib.request.urlopen(req, timeout=75) as response:
              payload = json.load(response)
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
