name: APNs registration monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKEND_URL: https://oshireader.onrender.com
      ALERT_CONTEXT: apns-registration-monitor
    steps:
      - name: Check required secret
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Check registration health
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          backend_url = os.environ["BACKEND_URL"].rstrip("/")
          token = os.environ["ADMIN_API_TOKEN"]

          class ResponseFormatError(Exception):
              pass

          def request_json(url, *, method="GET", timeout=90):
              request = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}"},
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  try:
                      payload = json.loads(body)
                  except json.JSONDecodeError as exc:
                      raise ResponseFormatError(
                          f"Backend returned non-JSON response from {url}"
                      ) from exc
                  return response.status, payload

          def fetch_diagnostics():
              try:
                  status, payload = request_json(f"{backend_url}/api/admin/poller-health")
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"Backend diagnostics returned HTTP {exc.code}") from exc
              except ResponseFormatError as exc:
                  raise SystemExit(str(exc)) from exc
              print(f"Backend status: {status}")
              if status != 200:
                  raise SystemExit(f"Backend diagnostics returned HTTP {status}")
              if not isinstance(payload, dict):
                  raise SystemExit("Backend diagnostics must be an object")
              return payload

          def orphaned_ids(health, key):
              raw_ids = health.get(key)
              if raw_ids is None:
                  raw_ids = []
              if not isinstance(raw_ids, list):
                  raise SystemExit(f"notification_health field {key} must be a list")
              ids = []
              for raw_id in raw_ids:
                  try:
                      term_id = int(raw_id)
                  except (TypeError, ValueError) as exc:
                      raise SystemExit(
                          f"notification_health field {key} contains an invalid term id"
                      ) from exc
                  if term_id <= 0:
                      raise SystemExit(
                          f"notification_health field {key} contains a non-positive term id"
                      )
                  ids.append(term_id)
              return list(dict.fromkeys(ids))

          def object_field(payload, key):
              value = payload.get(key)
              if value is None:
                  return {}
              if not isinstance(value, dict):
                  raise SystemExit(f"{key} diagnostics must be an object")
              return value

          def validated_notification_health(payload):
              health = payload.get("notification_health")
              required_keys = {
                  "active_notify_terms",
                  "active_notify_terms_without_verified_devices",
                  "active_notify_term_ids_without_verified_devices",
              }
              if not isinstance(health, dict):
                  raise SystemExit("Missing notification_health diagnostics")
              missing_keys = sorted(required_keys - set(health))
              if missing_keys:
                  raise SystemExit(
                      f"notification_health diagnostics missing required field(s): {missing_keys}"
                  )
              return health

          def health_count(health, key):
              try:
                  value = int(health.get(key))
              except (TypeError, ValueError) as exc:
                  raise SystemExit(f"notification_health field {key} is not an integer") from exc
              if value < 0:
                  raise SystemExit(f"notification_health field {key} is negative: {value}")
              return value

          def registration_reasons(payload):
              registration = payload.get("apns_registration")
              if registration is None:
                  raise SystemExit("apns_registration field missing from backend diagnostics response")
              if not isinstance(registration, dict):
                  raise SystemExit("apns_registration diagnostics must be an object")
              apns = object_field(payload, "apns")
              server_environment = str(apns.get("server_environment") or "")
              reasons_by_environment = registration.get("reasons_by_environment")
              if isinstance(reasons_by_environment, dict) and server_environment:
                  reasons = reasons_by_environment.get(server_environment)
                  if reasons is None:
                      reasons = {}
              else:
                  reasons = registration.get("reasons")
              if reasons is None:
                  reasons = {}
              if not isinstance(reasons, dict):
                  raise SystemExit("apns_registration reasons must be an object")
              parsed = {}
              for reason, raw_count in reasons.items():
                  try:
                      count = int(raw_count)
                  except (TypeError, ValueError) as exc:
                      raise SystemExit(
                          "apns_registration reason count is not an integer"
                      ) from exc
                  if count < 0:
                      raise SystemExit("apns_registration reason count is negative")
                  parsed[str(reason)] = count
              return parsed

          try:
              urllib.request.urlopen(f"{backend_url}/api/health", timeout=90).read()
          except Exception as exc:
              print(f"Backend warm-up failed; continuing with diagnostics: {exc}", file=sys.stderr)

          payload = fetch_diagnostics()
          health = validated_notification_health(payload)
          apns = object_field(payload, "apns")
          registration = object_field(payload, "apns_registration")
          reasons = registration_reasons(payload)
          print(json.dumps({
              "notification_health": {
                  key: health.get(key)
                  for key in (
                      "healthy",
                      "active_notify_terms",
                      "active_silent_orphan_terms",
                      "active_notify_terms_without_verified_devices",
                      "orphaned_notification_grace_minutes",
                  )
                  if key in health
              },
              "apns": {
                  key: apns.get(key)
                  for key in (
                      "configured",
                      "server_environment",
                      "device_tokens_by_environment",
                      "device_tokens_by_environment_and_verification",
                  )
                  if key in apns
              },
              "apns_registration": {
                  "count": registration.get("count"),
                  "reasons": reasons,
              },
          }, ensure_ascii=False, indent=2, default=str))
          orphaned_ids(health, "active_notify_term_ids_without_verified_devices")

          failures = []
          active_notify_terms = health_count(health, "active_notify_terms")
          if active_notify_terms and apns.get("configured") is not True:
              failures.append(
                  f"APNs is not configured while {active_notify_terms} active notification term(s) exist"
              )
          missing = health_count(health, "active_notify_terms_without_verified_devices")
          if missing:
              failures.append(
                  f"{missing} active notification term(s) have no verified APNs device"
              )
          repeated = {reason: count for reason, count in reasons.items() if count >= 3}
          if repeated:
              failures.append(
                  f"Repeated APNs registration rejection reason(s) in the diagnostics window: {repeated}"
              )
          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - name: Send failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "No ALERT_WEBHOOK_URL configured; skipping failure alert"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          run_url = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
          message = (
              "OshiReader workflow failure: "
              f"{os.environ.get('ALERT_CONTEXT')} "
              f"({os.environ.get('GITHUB_WORKFLOW')})\n"
              f"{run_url}"
          )
          payload = {
              "content": message,
              "text": message,
              "status": "failure",
              "context": os.environ.get("ALERT_CONTEXT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "url": run_url,
          }
          request = urllib.request.Request(
              os.environ["ALERT_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "OshiReader-Monitor/1.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(f"Alert webhook status: {response.status}")
          except Exception as exc:
              print(f"Alert webhook failed: {exc}")
          PY
