name: Backend maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Maintenance action to run
        required: true
        type: choice
        options:
          - purge-youtube-bad-dates
          - purge-youtube-google-news
          - purge-yahoonews-bad-dates
          - prune-storage
          - enable-notify-terms
          - mute-orphaned-notify-terms
          - deactivate-orphaned-terms
      term_ids:
        description: Comma-separated watch term IDs for orphaned-term maintenance actions
        required: false
        default: ""

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_URL: https://oshireader.onrender.com
      ACTION: ${{ inputs.action }}
      TERM_IDS: ${{ inputs.term_ids }}
    steps:
      - name: Check required secret
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Warm backend
        run: |
          curl --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 90 \
            "$BACKEND_URL/api/health" || true

      - name: Purge YouTube bad-date items
        if: inputs.action == 'purge-youtube-bad-dates'
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set +e
          STATUS=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            "$BACKEND_URL/api/admin/maintenance/purge-youtube-bad-dates" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" \
            --max-time 120)
          CURL_EXIT=$?
          set -e
          echo "YouTube bad-date cleanup response HTTP $STATUS"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "YouTube bad-date cleanup curl failed with exit code $CURL_EXIT"
            exit "$CURL_EXIT"
          fi
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      - name: Purge YouTube Google News fallback items
        if: inputs.action == 'purge-youtube-google-news'
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set +e
          STATUS=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            "$BACKEND_URL/api/admin/maintenance/purge-youtube-google-news" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" \
            --max-time 120)
          CURL_EXIT=$?
          set -e
          echo "YouTube Google News cleanup response HTTP $STATUS"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "YouTube Google News cleanup curl failed with exit code $CURL_EXIT"
            exit "$CURL_EXIT"
          fi
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      - name: Purge Yahoo News bad-date items
        if: inputs.action == 'purge-yahoonews-bad-dates'
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set +e
          STATUS=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            "$BACKEND_URL/api/admin/maintenance/purge-yahoonews-bad-dates" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" \
            --max-time 120)
          CURL_EXIT=$?
          set -e
          echo "Yahoo News bad-date cleanup response HTTP $STATUS"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "Yahoo News bad-date cleanup curl failed with exit code $CURL_EXIT"
            exit "$CURL_EXIT"
          fi
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      - name: Prune storage for test quota recovery
        if: inputs.action == 'prune-storage'
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set +e
          STATUS=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            "$BACKEND_URL/api/admin/maintenance/prune-storage?match_per_term_platform_limit=100&muted_per_term_limit=500&backend_event_keep=200&include_discussion_platforms=true" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" \
            --max-time 60)
          CURL_EXIT=$?
          set -e
          echo "Prune response HTTP $STATUS"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "Prune storage curl failed with exit code $CURL_EXIT"
            exit "$CURL_EXIT"
          fi
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      - name: Mute orphaned notification terms
        if: inputs.action == 'mute-orphaned-notify-terms'
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$TERM_IDS" ]; then
            echo "term_ids is required for mute-orphaned-notify-terms"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          backend_url = os.environ["BACKEND_URL"].rstrip("/")
          token = os.environ["ADMIN_API_TOKEN"]
          query = urllib.parse.urlencode({
              "action": "mute-notify",
              "term_ids": os.environ["TERM_IDS"],
          })
          request = urllib.request.Request(
              f"{backend_url}/api/admin/maintenance/orphaned-terms?{query}",
              headers={"Authorization": f"Bearer {token}"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  try:
                      payload = json.loads(body)
                  except json.JSONDecodeError as exc:
                      raise SystemExit("orphaned term maintenance returned non-JSON response") from exc
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"orphaned term maintenance returned HTTP {exc.code}")
          except (TimeoutError, urllib.error.URLError, OSError):
              raise SystemExit("orphaned term maintenance request failed") from None
          if not isinstance(payload, dict):
              raise SystemExit("orphaned term maintenance returned a non-object payload")
          updated_terms = payload.get("updated_terms")
          if not isinstance(updated_terms, list):
              raise SystemExit("orphaned term maintenance returned invalid updated terms")
          print(json.dumps({
              "action": "mute-notify",
              "updated_count": len(updated_terms),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Enable notification terms with verified devices
        if: inputs.action == 'enable-notify-terms'
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$TERM_IDS" ]; then
            echo "term_ids is required for enable-notify-terms"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          backend_url = os.environ["BACKEND_URL"].rstrip("/")
          token = os.environ["ADMIN_API_TOKEN"]
          headers = {"Authorization": f"Bearer {token}"}
          try:
              term_ids = list(dict.fromkeys(
                  int(value.strip())
                  for value in os.environ["TERM_IDS"].split(",")
                  if value.strip()
              ))
          except ValueError as exc:
              raise SystemExit("term_ids must contain only integers") from exc
          if not term_ids or any(term_id <= 0 for term_id in term_ids):
              raise SystemExit("term_ids must contain positive integers")

          health_request = urllib.request.Request(
              f"{backend_url}/api/admin/poller-health",
              headers=headers,
          )
          with urllib.request.urlopen(health_request, timeout=90) as response:
              health = json.load(response)
          terms = {
              int(term["id"]): term
              for term in health.get("watch_terms", [])
              if isinstance(term, dict) and "id" in term
          }
          failures = []
          for term_id in term_ids:
              term = terms.get(term_id)
              if term is None:
                  failures.append({"term_id": term_id, "reason": "not_found"})
              elif int(term.get("notification_verified_devices_for_server_environment") or 0) <= 0:
                  failures.append({"term_id": term_id, "reason": "no_verified_apns_device"})
          if failures:
              raise SystemExit(f"Refusing to enable notification term(s): {failures}")

          for term_id in term_ids:
              request = urllib.request.Request(
                  f"{backend_url}/api/watch-terms/{term_id}",
                  data=json.dumps({"notify_on_new": True}).encode("utf-8"),
                  headers={**headers, "Content-Type": "application/json"},
                  method="PATCH",
              )
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"Failed to enable term {term_id}: HTTP {exc.code}") from exc
              if not isinstance(payload, dict) or payload.get("notify_on_new") is not True:
                  raise SystemExit(f"Term {term_id} did not enable notifications")
          print(json.dumps({"enabled_count": len(term_ids)}, ensure_ascii=False))
          PY

      - name: Deactivate orphaned terms
        if: inputs.action == 'deactivate-orphaned-terms'
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$TERM_IDS" ]; then
            echo "term_ids is required for deactivate-orphaned-terms"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          backend_url = os.environ["BACKEND_URL"].rstrip("/")
          token = os.environ["ADMIN_API_TOKEN"]
          query = urllib.parse.urlencode({
              "action": "deactivate",
              "term_ids": os.environ["TERM_IDS"],
          })
          request = urllib.request.Request(
              f"{backend_url}/api/admin/maintenance/orphaned-terms?{query}",
              headers={"Authorization": f"Bearer {token}"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  try:
                      payload = json.loads(body)
                  except json.JSONDecodeError as exc:
                      raise SystemExit("orphaned term maintenance returned non-JSON response") from exc
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"orphaned term maintenance returned HTTP {exc.code}")
          except (TimeoutError, urllib.error.URLError, OSError):
              raise SystemExit("orphaned term maintenance request failed") from None
          if not isinstance(payload, dict):
              raise SystemExit("orphaned term maintenance returned a non-object payload")
          updated_terms = payload.get("updated_terms")
          if not isinstance(updated_terms, list):
              raise SystemExit("orphaned term maintenance returned invalid updated terms")
          print(json.dumps({
              "action": "deactivate",
              "updated_count": len(updated_terms),
          }, ensure_ascii=False, indent=2))
          PY
