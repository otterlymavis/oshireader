name: Backend maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Maintenance action to run
        required: true
        type: choice
        options:
          - purge-youtube-bad-dates
          - purge-youtube-google-news
          - purge-yahoonews-bad-dates
          - prune-storage
          - mute-orphaned-notify-terms
      term_ids:
        description: Comma-separated watch term IDs for mute-orphaned-notify-terms
        required: false
        default: ""

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: https://oshireader.onrender.com
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      ACTION: ${{ inputs.action }}
      TERM_IDS: ${{ inputs.term_ids }}
    steps:
      - name: Check required secret
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Purge YouTube bad-date items
        if: inputs.action == 'purge-youtube-bad-dates'
        run: |
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error \
            --output "$BODY" \
            --write-out "%{http_code}" \
            --request POST \
            "$BACKEND_URL/api/admin/maintenance/purge-youtube-bad-dates" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" \
            --max-time 120)
          echo "YouTube bad-date cleanup response HTTP $STATUS"
          cat "$BODY"
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      - name: Purge YouTube Google News fallback items
        if: inputs.action == 'purge-youtube-google-news'
        run: |
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error \
            --output "$BODY" \
            --write-out "%{http_code}" \
            --request POST \
            "$BACKEND_URL/api/admin/maintenance/purge-youtube-google-news" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" \
            --max-time 120)
          echo "YouTube Google News cleanup response HTTP $STATUS"
          cat "$BODY"
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      - name: Purge Yahoo News bad-date items
        if: inputs.action == 'purge-yahoonews-bad-dates'
        run: |
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error \
            --output "$BODY" \
            --write-out "%{http_code}" \
            --request POST \
            "$BACKEND_URL/api/admin/maintenance/purge-yahoonews-bad-dates" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" \
            --max-time 120)
          echo "Yahoo News bad-date cleanup response HTTP $STATUS"
          cat "$BODY"
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      - name: Prune storage for test quota recovery
        if: inputs.action == 'prune-storage'
        run: |
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error \
            --output "$BODY" \
            --write-out "%{http_code}" \
            --request POST \
            "$BACKEND_URL/api/admin/maintenance/prune-storage?match_per_term_platform_limit=100&muted_per_term_limit=500&backend_event_keep=200&include_discussion_platforms=true" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN" \
            --max-time 60)
          echo "Prune response HTTP $STATUS"
          cat "$BODY"
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi

      - name: Mute orphaned notification terms
        if: inputs.action == 'mute-orphaned-notify-terms'
        run: |
          if [ -z "$TERM_IDS" ]; then
            echo "term_ids is required for mute-orphaned-notify-terms"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          backend_url = os.environ["BACKEND_URL"].rstrip("/")
          token = os.environ["ADMIN_API_TOKEN"]
          raw_ids = os.environ["TERM_IDS"]
          term_ids = []
          for raw in raw_ids.split(","):
              raw = raw.strip()
              if not raw:
                  continue
              if not raw.isdigit():
                  raise SystemExit(f"Invalid watch term id: {raw!r}")
              term_ids.append(int(raw))

          if not term_ids:
              raise SystemExit("No watch term ids provided")

          results = []
          for term_id in term_ids:
              request = urllib.request.Request(
                  f"{backend_url}/api/watch-terms/{term_id}",
                  data=json.dumps({"notify_on_new": False}).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="PATCH",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = json.load(response)
                      results.append({
                          "term_id": term_id,
                          "status": response.status,
                          "notify_on_new": body.get("notify_on_new"),
                          "is_active": body.get("is_active"),
                          "keyword": body.get("keyword"),
                      })
              except urllib.error.HTTPError as exc:
                  error_body = exc.read().decode("utf-8", errors="replace")
                  results.append({
                      "term_id": term_id,
                      "status": exc.code,
                      "error": error_body,
                  })

          print(json.dumps({"muted_terms": results}, ensure_ascii=False, indent=2))
          failed = [row for row in results if row.get("status") != 200]
          if failed:
              raise SystemExit(f"Failed to mute one or more terms: {failed}")
          PY
