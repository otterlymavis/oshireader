name: Deploy Render

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-render
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      BACKEND_URL: https://oshireader.onrender.com
      # The Render service deploys its configured production branch. Keep this
      # explicit so a manual run started from another ref verifies the commit
      # that Render will actually deploy.
      DEPLOY_REF: master
    steps:
      - name: Check required secret
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing GitHub Actions secret: RENDER_DEPLOY_HOOK_URL"
            echo "Create a Render deploy hook for the backend service, then save it as this repository secret."
            exit 1
          fi

      - name: Resolve Render deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 1

      - name: Record expected deployment commit
        run: echo "EXPECTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Trigger Render deploy
        run: |
          STATUS=$(curl -sS -o /tmp/render-deploy-response.json -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL" \
            --max-time 30)
          echo "Render deploy hook status: $STATUS"
          echo "Response body: $(cat /tmp/render-deploy-response.json)"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            exit 1
          fi

      - name: Verify deployed backend and APNs contract
        run: |
          for attempt in $(seq 1 24); do
            if python3 - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["BACKEND_URL"].rstrip("/")
          with urllib.request.urlopen(f"{base}/api/health", timeout=20) as response:
              health = json.load(response)
          if health.get("status") != "ok":
              raise SystemExit(f"Backend health is not ready: {health}")
          deployed_commit = health.get("commit")
          expected_commit = os.environ["EXPECTED_COMMIT"]
          if deployed_commit != expected_commit:
              raise SystemExit(
                  f"Backend commit is {deployed_commit!r}, expected {expected_commit!r}"
              )

          with urllib.request.urlopen(f"{base}/openapi.json", timeout=20) as response:
              openapi = json.load(response)
          schemas = openapi.get("components", {}).get("schemas", {})
          apns_properties = schemas.get("APNSDeviceTokenOut", {}).get("properties", {})
          required_apns = {"is_verified", "verification_error", "bundle_id"}
          if not required_apns.issubset(apns_properties):
              raise SystemExit(f"APNs response contract is not deployed: {sorted(apns_properties)}")
          entitlement_properties = schemas.get("EntitlementStatusOut", {}).get("properties", {})
          required_entitlement = {"push_term_limit", "push_term_count", "push_delivery_state"}
          if not required_entitlement.issubset(entitlement_properties):
              raise SystemExit(
                  f"Paid-push entitlement contract is not deployed: {sorted(entitlement_properties)}"
              )
          if "/api/entitlements/apple-notifications" not in openapi.get("paths", {}):
              raise SystemExit("Apple notification lifecycle endpoint is not deployed")
          print(f"Backend is healthy at commit {health.get('commit', 'unknown')}")
          PY
            then
              exit 0
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Backend did not expose the expected deployed contract"
              exit 1
            fi
            echo "Backend deployment is still rolling out; retrying ($attempt/24)"
            sleep 15
          done
