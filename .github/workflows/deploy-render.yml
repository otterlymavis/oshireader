name: Deploy Render

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      BACKEND_URL: https://oshireader.onrender.com
    steps:
      - name: Check required secret
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing GitHub Actions secret: RENDER_DEPLOY_HOOK_URL"
            echo "Create a Render deploy hook for the backend service, then save it as this repository secret."
            exit 1
          fi

      - name: Trigger Render deploy
        run: |
          STATUS=$(curl -sS -o /tmp/render-deploy-response.json -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL" \
            --max-time 30)
          echo "Render deploy hook status: $STATUS"
          echo "Response body: $(cat /tmp/render-deploy-response.json)"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            exit 1
          fi

      - name: Verify deployed backend and APNs contract
        run: |
          for attempt in $(seq 1 24); do
            if python3 - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["BACKEND_URL"].rstrip("/")
          with urllib.request.urlopen(f"{base}/api/health", timeout=20) as response:
              health = json.load(response)
          if health.get("status") != "ok":
              raise SystemExit(f"Backend health is not ready: {health}")

          with urllib.request.urlopen(f"{base}/openapi.json", timeout=20) as response:
              openapi = json.load(response)
          properties = (openapi.get("components", {}).get("schemas", {})
                        .get("APNSDeviceTokenOut", {}).get("properties", {}))
          required = {"is_verified", "verification_error"}
          if not required.issubset(properties):
              raise SystemExit(f"APNs response contract is not deployed: {sorted(properties)}")
          print(f"Backend is healthy at commit {health.get('commit', 'unknown')}")
          PY
            then
              exit 0
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Backend did not expose the expected deployed contract"
              exit 1
            fi
            echo "Backend deployment is still rolling out; retrying ($attempt/24)"
            sleep 15
          done
