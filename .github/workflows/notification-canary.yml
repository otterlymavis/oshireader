name: Notification canary

on:
  workflow_dispatch:

concurrency:
  group: notification-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_CANARY_URL: https://oshireader.onrender.com/api/admin/notification-canary
      ALERT_CONTEXT: notification-canary
    steps:
      - name: Check required secret
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Check verified-device eligibility
        id: eligibility
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          BODY=$(mktemp)
          trap 'rm -f "$BODY"' EXIT
          STATUS=$(curl --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 10 \
            --output "$BODY" \
            --write-out "%{http_code}" \
            --max-time 60 \
            "https://oshireader.onrender.com/api/admin/poller-health" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN")
          if [ "$STATUS" != "200" ]; then
            echo "Eligibility diagnostics returned HTTP $STATUS"
            exit 1
          fi
          python3 - "$BODY" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)
          counts = (payload.get("apns") or {}).get(
              "device_tokens_by_environment_and_verification", {}
          )
          verified = sum((value or {}).get("verified", 0) for value in counts.values())
          if verified < 1:
              print("No verified APNs device is available; notification canary skipped.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("canary_allowed=false\n")
          else:
              print(f"Verified APNs devices available: {verified}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("canary_allowed=true\n")
          PY

      - name: Skip canary without verified device
        if: steps.eligibility.outputs.canary_allowed != 'true'
        run: echo "Canary skipped because no verified APNs device is available"

      - name: Send synthetic notification canary
        if: steps.eligibility.outputs.canary_allowed == 'true'
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          BODY=$(mktemp)
          trap 'rm -f "$BODY"' EXIT
          STATUS=$(curl --silent --show-error \
            --output "$BODY" \
            --write-out "%{http_code}" \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 60 \
            -X POST \
            "$BACKEND_CANARY_URL?all_terms=true" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN")

          echo "HTTP status: $STATUS"

          python3 - "$STATUS" "$BODY" <<'PY'
          import json
          import sys

          status = sys.argv[1]
          with open(sys.argv[2], encoding="utf-8") as response_file:
              response_payload = json.load(response_file)

          if not isinstance(response_payload, dict):
              raise SystemExit("canary endpoint returned a non-object payload")
          detail = response_payload.get("detail")
          payload = detail if isinstance(detail, dict) else response_payload

          raw_terms = payload.get("terms")
          terms = raw_terms if isinstance(raw_terms, list) else []
          term_summaries = []
          for index, term in enumerate(terms, start=1):
              if not isinstance(term, dict):
                  term_summaries.append({"term_index": index, "valid": False})
                  continue
              apns_event = term.get("apns_event") or {}
              if not isinstance(apns_event, dict):
                  apns_event = {}
              apns_payload = apns_event.get("payload") or {}
              if not isinstance(apns_payload, dict):
                  apns_payload = {}
              term_summaries.append({
                  "term_index": index,
                  "valid": True,
                  "delivered": term.get("delivered"),
                  "device_count": apns_payload.get("device_count"),
                  "delivered_count": apns_payload.get("delivered_count"),
                  "retryable_failures": apns_payload.get("retryable_failures"),
                  "pruned_tokens": apns_payload.get("pruned_tokens"),
              })
          summary = {
              "all_terms": payload.get("all_terms"),
              "delivered": payload.get("delivered"),
              "term_count": len(terms),
              "terms": term_summaries,
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2, default=str))

          failures = []
          if status != "200":
              failures.append(f"canary endpoint returned HTTP {status}")
          if payload.get("delivered") is not True:
              failures.append("canary did not deliver")
          if not isinstance(raw_terms, list) or not terms:
              failures.append("canary response did not include term results")
          for index, term in enumerate(terms, start=1):
              if not isinstance(term, dict):
                  failures.append(f"term_index={index} result is not an object")
                  continue
              apns_event = term.get("apns_event") or {}
              if not isinstance(apns_event, dict):
                  apns_event = {}
              apns_payload = apns_event.get("payload") or {}
              if not isinstance(apns_payload, dict):
                  apns_payload = {}
              device_count = apns_payload.get("device_count", 0)
              delivered_count = apns_payload.get("delivered_count", 0)
              retryable_failures = apns_payload.get("retryable_failures", 0)
              pruned_tokens = apns_payload.get("pruned_tokens", 0)
              term_label = f"term_index={index}"
              if term.get("delivered") is not True:
                  failures.append(f"{term_label} did not deliver")
              if device_count < 1:
                  failures.append(f"{term_label} APNs event did not target any devices")
              if delivered_count < 1:
                  failures.append(f"{term_label} APNs event did not record a delivery")
              if delivered_count != device_count:
                  failures.append(
                      f"{term_label} APNs delivery was incomplete: "
                      f"delivered={delivered_count} device_count={device_count}"
                  )
              if retryable_failures:
                  failures.append(f"{term_label} APNs had retryable failures: {retryable_failures}")
              if pruned_tokens:
                  failures.append(f"{term_label} APNs pruned invalid tokens: {pruned_tokens}")
          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - name: Send failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "No ALERT_WEBHOOK_URL configured; skipping failure alert"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          run_url = (
              f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}"
              f"/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
          )
          message = (
              "OshiReader workflow failure: "
              f"{os.environ.get('ALERT_CONTEXT')} "
              f"({os.environ.get('GITHUB_WORKFLOW')} / {os.environ.get('GITHUB_JOB')})\n"
              f"{run_url}"
          )
          payload = {
              "content": message,
              "text": message,
              "status": "failure",
              "context": os.environ.get("ALERT_CONTEXT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "job": os.environ.get("GITHUB_JOB"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "ref": os.environ.get("GITHUB_REF_NAME"),
              "sha": os.environ.get("GITHUB_SHA"),
              "url": run_url,
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              os.environ["ALERT_WEBHOOK_URL"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "OshiReader-Monitor/1.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print(f"Alert webhook status: {response.status}")
          except Exception as exc:
              print(f"Alert webhook failed: {exc}")
          PY
