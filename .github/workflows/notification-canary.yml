name: Notification canary

on:
  workflow_dispatch:

concurrency:
  group: notification-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_CANARY_URL: https://oshireader.onrender.com/api/admin/notification-canary
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_CONTEXT: notification-canary
    steps:
      - name: Check required secret
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Send synthetic notification canary
        run: |
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error \
            --output "$BODY" \
            --write-out "%{http_code}" \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 60 \
            -X POST \
            "$BACKEND_CANARY_URL?all_terms=true" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN")

          echo "HTTP status: $STATUS"
          cat "$BODY"
          echo

          python3 - "$STATUS" "$BODY" <<'PY'
          import json
          import sys

          status = sys.argv[1]
          with open(sys.argv[2], encoding="utf-8") as response_file:
              payload = json.load(response_file)

          terms = payload.get("terms") or [payload]
          summary = {
              "all_terms": payload.get("all_terms"),
              "delivered": payload.get("delivered"),
              "terms": terms,
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2, default=str))

          failures = []
          if status != "200":
              failures.append(f"canary endpoint returned HTTP {status}")
          if payload.get("delivered") is not True:
              failures.append(f"canary did not deliver: {payload}")
          if not terms:
              failures.append(f"canary response did not include term results: {payload}")
          for term in terms:
              apns_event = term.get("apns_event") or {}
              apns_payload = apns_event.get("payload") or {}
              device_count = apns_payload.get("device_count", 0)
              delivered_count = apns_payload.get("delivered_count", 0)
              retryable_failures = apns_payload.get("retryable_failures", 0)
              pruned_tokens = apns_payload.get("pruned_tokens", 0)
              term_label = f"term_id={term.get('term_id')} keyword={term.get('keyword')}"
              if term.get("delivered") is not True:
                  failures.append(f"{term_label} did not deliver: {term}")
              if device_count < 1:
                  failures.append(f"{term_label} APNs event did not target any devices: {apns_event}")
              if delivered_count < 1:
                  failures.append(f"{term_label} APNs event did not record a delivery: {apns_event}")
              if delivered_count != device_count:
                  failures.append(
                      f"{term_label} APNs delivery was incomplete: "
                      f"delivered={delivered_count} device_count={device_count}"
                  )
              if retryable_failures:
                  failures.append(f"{term_label} APNs had retryable failures: {retryable_failures}")
              if pruned_tokens:
                  failures.append(f"{term_label} APNs pruned invalid tokens: {pruned_tokens}")
          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - name: Send failure alert
        if: failure()
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "No ALERT_WEBHOOK_URL configured; skipping failure alert"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "status": "failure",
              "context": os.environ.get("ALERT_CONTEXT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "job": os.environ.get("GITHUB_JOB"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "ref": os.environ.get("GITHUB_REF_NAME"),
              "sha": os.environ.get("GITHUB_SHA"),
              "url": (
                  f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}"
                  f"/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
              ),
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              os.environ["ALERT_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print(f"Alert webhook status: {response.status}")
          except Exception as exc:
              print(f"Alert webhook failed: {exc}")
          PY
