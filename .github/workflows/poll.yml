name: Poll feed

on:
  workflow_call:
  schedule:
    # Redundant fallback for a missed Cloudflare cron tick. The backend poll
    # lock and due-term checks make this safe when the primary poll succeeds.
    # CF crons fire at 0 */2 and 0 1/2; this fires at :30 as a mid-window catch.
    - cron: "30 */2 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

concurrency:
  group: poll-feed
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://oshireader.onrender.com
      ALERT_CONTEXT: poll-feed
    steps:
      - name: Check required secret
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Trigger backend poll
        id: poll_trigger
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          for attempt in $(seq 1 18); do
            BODY=$(mktemp)
            set +e
            STATUS=$(curl -sS -o "$BODY" -w "%{http_code} time=%{time_total}s" -X POST \
              "$BACKEND_URL/api/admin/poll" \
              -H "Authorization: Bearer $ADMIN_API_TOKEN" \
              -H "Content-Type: application/json" \
              --max-time 260)
            CURL_EXIT=$?
            set -e
            echo "Attempt $attempt response status: $STATUS"
            if [ "$CURL_EXIT" -eq 28 ]; then
              rm -f "$BODY"
              echo "Poll request timed out locally; diagnostics will wait for the backend poll to settle."
              echo "diagnostics_ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$CURL_EXIT" -ne 0 ]; then
              rm -f "$BODY"
              echo "Poll request curl failed with exit code $CURL_EXIT"
              exit "$CURL_EXIT"
            fi
            CODE=${STATUS%% *}
            if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then
              if [ "$CODE" -ge 500 ] && [ "$CODE" -lt 600 ]; then
                rm -f "$BODY"
                if [ "$attempt" -eq 18 ]; then
                  echo "Poll request kept returning backend 5xx after $attempt attempts"
                  exit 1
                fi
                echo "Poll request hit transient backend status $CODE; retrying."
                sleep 20
                continue
              fi
              rm -f "$BODY"
              echo "Poll request failed with status $CODE"
              exit 1
            fi

            if ! POLL_STATUS=$(python3 - "$BODY" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              body = fh.read()
          try:
              payload = json.loads(body)
          except json.JSONDecodeError as exc:
              print(f"Invalid poll response JSON: {exc}", file=sys.stderr)
              raise SystemExit(2)
          if not isinstance(payload, dict):
              print("Invalid poll response payload: expected an object", file=sys.stderr)
              raise SystemExit(2)
          print((payload.get("status") or "").strip())
          PY
          ); then
              rm -f "$BODY"
              exit 1
            fi
            rm -f "$BODY"

            if [ "$POLL_STATUS" = "poll completed" ]; then
              echo "diagnostics_ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$POLL_STATUS" = "poll still running (request timed out)" ]; then
              echo "Poll is still running after request timeout; diagnostics will wait for the outbox to settle."
              echo "diagnostics_ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$POLL_STATUS" != "poll already running" ]; then
              echo "Unexpected poll response status: $POLL_STATUS"
              exit 1
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Backend poll remained busy after $attempt attempts; backend poll may be stuck"
              exit 1
            fi
            sleep 20
          done

      - name: Validate backend notification diagnostics
        if: steps.poll_trigger.outputs.diagnostics_ready == 'true'
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          for attempt in $(seq 1 24); do
            BODY=$(mktemp)
            STATUS=$(curl -sS -o "$BODY" -w "%{http_code}" \
              "$BACKEND_URL/api/admin/poller-health" \
              -H "Authorization: Bearer $ADMIN_API_TOKEN" \
              --max-time 30 || true)
            if [ "$STATUS" != "200" ]; then
              echo "Poller health attempt $attempt failed with status ${STATUS:-curl_failed}"
              rm -f "$BODY"
              if [ "$attempt" -eq 24 ]; then
                exit 1
              fi
              sleep 15
              continue
            fi
            if python3 - "$BODY" "$attempt" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              body = fh.read()
          try:
              data = json.loads(body)
          except json.JSONDecodeError as exc:
              print(f"Invalid diagnostics JSON: {exc}", file=sys.stderr)
              raise SystemExit(2)
          if not isinstance(data, dict):
              print("Invalid diagnostics payload: expected an object", file=sys.stderr)
              raise SystemExit(2)
          attempt = sys.argv[2]

          def object_field(payload, key):
              value = payload.get(key)
              if value is None:
                  return {}
              if not isinstance(value, dict):
                  print(f"Invalid diagnostics field {key}: expected an object", file=sys.stderr)
                  raise SystemExit(2)
              return value

          def notification_health_summary(health):
              safe_keys = {
                  "healthy",
                  "active_notify_terms",
                  "active_silent_orphan_terms",
                  "active_notify_terms_without_verified_devices",
                  "orphaned_notification_grace_minutes",
              }
              return {key: health.get(key) for key in safe_keys if key in health}

          def poll_event_summary(event):
              safe_payload_keys = {
                  "terms",
                  "total_terms",
                  "due_terms",
                  "notification_lane_terms",
                  "regular_lane_terms",
                  "connectors",
                  "new_matches",
                  "failed_connectors",
                  "flushed_pending_terms",
                  "term_offset",
                  "next_term_offset",
              }
              payload = event.get("payload")
              if not isinstance(payload, dict):
                  payload = {}
              return {
                  "id": event.get("id"),
                  "status": event.get("status"),
                  "created_at": event.get("created_at"),
                  "payload": {
                      key: payload.get(key)
                      for key in safe_payload_keys
                      if key in payload
                  },
              }

          apns = object_field(data, "apns")
          notification_health = object_field(data, "notification_health")
          latest_poll = object_field(data, "latest_poll")
          latest_successful_poll = object_field(data, "latest_successful_poll")
          pending_notifications = data.get("pending_notifications")
          if pending_notifications is None:
              pending_notifications = []
          if not isinstance(pending_notifications, list):
              print("Invalid diagnostics field pending_notifications: expected a list", file=sys.stderr)
              raise SystemExit(2)
          summary = {
              "items_total": data.get("items_total"),
              "matches_total": data.get("matches_total"),
              "apns_configured": apns.get("configured"),
              "apns_server_environment": apns.get("server_environment"),
              "device_tokens_by_environment": apns.get("device_tokens_by_environment", {}),
              "device_tokens_by_environment_and_verification": apns.get(
                  "device_tokens_by_environment_and_verification", {}
              ),
              "notification_health": notification_health_summary(notification_health),
              "pending_notification_count": len(pending_notifications),
              "latest_poll": poll_event_summary(latest_poll),
              "latest_successful_poll": poll_event_summary(latest_successful_poll),
          }
          print(f"Diagnostics attempt {attempt}")
          print(json.dumps(summary, ensure_ascii=False, indent=2, default=str))
          failures = []
          if apns.get("configured") is not True:
              print("Notification warning: APNs is not configured")
          if notification_health.get("healthy") is not True:
              print("Notification warning: notification health is degraded")
          if latest_poll.get("status") in {"started", "running_past_request_timeout"}:
              failures.append(
                  "poll is still running: "
                  f"status={latest_poll.get('status')} created_at={latest_poll.get('created_at')}"
              )
          if pending_notifications:
              print(
                  "Notification warning: pending notifications remain after poll: "
                  f"count={len(pending_notifications)}"
              )
          if failures:
              raise SystemExit("; ".join(failures))
          PY
            then
              rm -f "$BODY"
              exit 0
            fi
            rm -f "$BODY"
            if [ "$attempt" -eq 24 ]; then
              exit 1
            fi
            echo "Diagnostics not settled yet; retrying."
            sleep 15
          done

      - name: Send failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "No ALERT_WEBHOOK_URL configured; skipping failure alert"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          run_url = (
              f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}"
              f"/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
          )
          message = (
              "OshiReader workflow failure: "
              f"{os.environ.get('ALERT_CONTEXT')} "
              f"({os.environ.get('GITHUB_WORKFLOW')} / {os.environ.get('GITHUB_JOB')})\n"
              f"{run_url}"
          )
          payload = {
              "content": message,
              "text": message,
              "status": "failure",
              "context": os.environ.get("ALERT_CONTEXT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "job": os.environ.get("GITHUB_JOB"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "ref": os.environ.get("GITHUB_REF_NAME"),
              "sha": os.environ.get("GITHUB_SHA"),
              "url": run_url,
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              os.environ["ALERT_WEBHOOK_URL"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "OshiReader-Monitor/1.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print(f"Alert webhook status: {response.status}")
          except Exception as exc:
              print(f"Alert webhook failed: {exc}")
          PY
