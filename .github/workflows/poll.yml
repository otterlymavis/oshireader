name: Poll feed

on:
  workflow_call:
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

concurrency:
  group: poll-feed
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://oshireader.onrender.com
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_CONTEXT: poll-feed
    steps:
      - name: Check required secret
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Trigger backend poll
        id: poll_trigger
        run: |
          for attempt in $(seq 1 18); do
            BODY=$(mktemp)
            STATUS=$(curl -sS -o "$BODY" -w "%{http_code} time=%{time_total}s" -X POST \
              "$BACKEND_URL/api/admin/poll" \
              -H "Authorization: Bearer $ADMIN_API_TOKEN" \
              -H "Content-Type: application/json" \
              --max-time 260)
            echo "Attempt $attempt response status: $STATUS"
            echo "Attempt $attempt response body: $(cat "$BODY")"
            CODE=${STATUS%% *}
            if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then
              echo "Poll request failed with status $CODE"
              exit 1
            fi

            POLL_STATUS=$(python3 - "$BODY" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print((json.load(fh).get("status") or "").strip())
          PY
          )
            rm -f "$BODY"

            if [ "$POLL_STATUS" = "poll completed" ]; then
              echo "diagnostics_ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$POLL_STATUS" = "poll still running (request timed out)" ]; then
              echo "Poll is still running after request timeout; diagnostics will wait for the outbox to settle."
              echo "diagnostics_ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$POLL_STATUS" != "poll already running" ]; then
              echo "Unexpected poll response status: $POLL_STATUS"
              exit 1
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Backend poll remained busy after $attempt attempts"
              exit 1
            fi
            sleep 20
          done

      - name: Validate backend notification diagnostics
        if: steps.poll_trigger.outputs.diagnostics_ready == 'true'
        run: |
          for attempt in $(seq 1 24); do
            BODY=$(mktemp)
            STATUS=$(curl -sS -o "$BODY" -w "%{http_code}" \
              "$BACKEND_URL/api/admin/poller-health" \
              -H "Authorization: Bearer $ADMIN_API_TOKEN" \
              --max-time 30 || true)
            if [ "$STATUS" != "200" ]; then
              echo "Poller health attempt $attempt failed with status ${STATUS:-curl_failed}"
              echo "Response body: $(cat "$BODY")"
              rm -f "$BODY"
              if [ "$attempt" -eq 24 ]; then
                exit 1
              fi
              sleep 15
              continue
            fi
            if python3 - "$BODY" "$attempt" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              data = json.load(fh)
          attempt = sys.argv[2]

          apns = data.get("apns", {})
          notification_health = data.get("notification_health") or {}
          pending_notifications = data.get("pending_notifications") or []
          latest_poll = data.get("latest_poll") or {}
          latest_successful_poll = data.get("latest_successful_poll") or {}
          summary = {
              "items_total": data.get("items_total"),
              "matches_total": data.get("matches_total"),
              "apns_configured": apns.get("configured"),
              "apns_server_environment": apns.get("server_environment"),
              "device_tokens_by_environment": apns.get("device_tokens_by_environment", {}),
              "device_tokens_by_environment_and_verification": apns.get(
                  "device_tokens_by_environment_and_verification", {}
              ),
              "notification_health": notification_health,
              "pending_notification_count": len(pending_notifications),
              "pending_notifications": pending_notifications[:5],
              "pending_notifications_truncated": max(0, len(pending_notifications) - 5),
              "latest_poll": {
                  "id": latest_poll.get("id"),
                  "status": latest_poll.get("status"),
                  "created_at": latest_poll.get("created_at"),
                  "payload": latest_poll.get("payload"),
              },
              "latest_successful_poll": {
                  "id": latest_successful_poll.get("id"),
                  "status": latest_successful_poll.get("status"),
                  "created_at": latest_successful_poll.get("created_at"),
                  "payload": latest_successful_poll.get("payload"),
              },
          }
          print(f"Diagnostics attempt {attempt}")
          print(json.dumps(summary, ensure_ascii=False, indent=2, default=str))
          failures = []
          if apns.get("configured") is not True:
              failures.append("APNs is not configured")
          if notification_health.get("healthy") is not True:
              failures.append(f"notification_health is degraded: {notification_health}")
          if latest_poll.get("status") in {"started", "running_past_request_timeout"}:
              failures.append(f"poll is still running: {latest_poll}")
          if pending_notifications:
              failures.append(f"pending notifications remain after poll: {pending_notifications}")
          if failures:
              raise SystemExit("; ".join(failures))
          PY
            then
              rm -f "$BODY"
              exit 0
            fi
            rm -f "$BODY"
            if [ "$attempt" -eq 24 ]; then
              exit 1
            fi
            echo "Diagnostics not settled yet; retrying."
            sleep 15
          done

      - name: Send failure alert
        if: failure()
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "No ALERT_WEBHOOK_URL configured; skipping failure alert"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "status": "failure",
              "context": os.environ.get("ALERT_CONTEXT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "job": os.environ.get("GITHUB_JOB"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "ref": os.environ.get("GITHUB_REF_NAME"),
              "sha": os.environ.get("GITHUB_SHA"),
              "url": (
                  f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}"
                  f"/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
              ),
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              os.environ["ALERT_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print(f"Alert webhook status: {response.status}")
          except Exception as exc:
              print(f"Alert webhook failed: {exc}")
          PY
