name: Poll feed

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:          # allow manual trigger from GitHub Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend poll
        run: |
          BODY=$(mktemp)
          STATUS=$(curl -s -o "$BODY" -w "%{http_code} time=%{time_total}s" -X POST \
            https://oshireader.onrender.com/api/admin/poll \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 120)
          echo "Response status: $STATUS"
          echo "Response body: $(cat "$BODY")"
          CODE=${STATUS%% *}
          if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then
            echo "Poll request failed with status $CODE"
            exit 1
          fi

      - name: APNS status (temp diagnostic)
        run: |
          curl -s --max-time 30 https://oshireader.onrender.com/api/admin/stats \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}" | python3 -m json.tool || true
