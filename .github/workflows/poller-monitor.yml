name: Poller monitor

on:
  schedule:
    # Run between Cloudflare's 2-hour cron ticks to check for missed polls.
    - cron: "27 */6 * * *"
  workflow_dispatch:

concurrency:
  group: poller-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_HEALTH_URL: https://oshireader-feed-poller.oshireader-otterlymavis.workers.dev/health
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_CONTEXT: poller-monitor
    steps:
      - name: Check poller health
        run: |
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error \
            --output "$BODY" \
            --write-out "%{http_code}" \
            --retry 1 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 210 \
            "$WORKER_HEALTH_URL" || true)

          echo "HTTP status: $STATUS"
          cat "$BODY"
          echo

          python3 - "$STATUS" "$BODY" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          status = sys.argv[1]
          with open(sys.argv[2], encoding="utf-8") as response_file:
              body = response_file.read()
          try:
              payload = json.loads(body)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Worker health returned non-JSON response: {exc}; body={body}") from exc
          if not isinstance(payload, dict):
              raise SystemExit(f"Worker health returned invalid payload: {payload}")

          def object_field(payload, key):
              value = payload.get(key)
              if value is None:
                  return {}
              if not isinstance(value, dict):
                  raise SystemExit(f"Worker health field {key} must be an object: {value!r}")
              return value

          diagnostics = object_field(payload, "diagnostics")
          latest_success = object_field(diagnostics, "latest_successful_poll")
          created_at = latest_success.get("created_at")
          latest_poll = object_field(diagnostics, "latest_poll")
          active_poll_within_stale_window = False
          apns = object_field(diagnostics, "apns")
          notification_health = object_field(diagnostics, "notification_health")
          pending_notifications = diagnostics.get("pending_notifications")
          if pending_notifications is None:
              pending_notifications = []
          if not isinstance(pending_notifications, list):
              raise SystemExit(
                  f"Worker health field pending_notifications must be a list: {pending_notifications!r}"
              )
          summary = {
              "healthy": payload.get("healthy"),
              "latest_successful_poll": latest_success,
              "latest_poll": latest_poll,
              "items_total": diagnostics.get("items_total"),
              "matches_total": diagnostics.get("matches_total"),
              "apns_configured": apns.get("configured"),
              "apns_server_environment": apns.get("server_environment"),
              "device_tokens_by_environment_and_verification": apns.get(
                  "device_tokens_by_environment_and_verification", {}
              ),
              "notification_health": notification_health,
              "pending_notifications": pending_notifications,
              "latest_relevant_apns": diagnostics.get("latest_relevant_apns"),
          }

          failures = []
          if latest_poll.get("status") in {"started", "running_past_request_timeout"}:
              latest_poll_created_at = latest_poll.get("created_at")
              if latest_poll_created_at:
                  started_at = datetime.fromisoformat(
                      latest_poll_created_at.replace("Z", "+00:00")
                  )
                  if started_at.tzinfo is None:
                      started_at = started_at.replace(tzinfo=timezone.utc)
                  active_poll_within_stale_window = (datetime.now(timezone.utc) - started_at).total_seconds() <= 360 * 60
          if status != "200":
              failures.append(f"worker health endpoint returned HTTP {status}")
          if payload.get("status") != "ok" or payload.get("healthy") is not True:
              failures.append(f"Poller health is degraded: {payload}")
          if payload.get("idle") is True:
              summary["idle"] = True
              print("Poller is healthy and idle; no recent successful poll is required.")
          elif not created_at:
              failures.append(f"Missing latest_successful_poll timestamp: {payload}")
          else:
              completed = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if completed.tzinfo is None:
                  completed = completed.replace(tzinfo=timezone.utc)
              age_minutes = (datetime.now(timezone.utc) - completed).total_seconds() / 60
              summary["age_minutes"] = round(age_minutes, 1)
              if age_minutes > 360 and not active_poll_within_stale_window:
                  failures.append(
                      f"Latest successful poll is too old: {age_minutes:.1f} minutes; payload={payload}"
                  )
              elif age_minutes > 360:
                  print(
                      "Latest successful poll is old, but an active poll is within the "
                      "stale grace window; deferring the stale failure."
                  )
          if apns.get("configured") is not True:
              print(f"Notification warning: APNs is not configured: {apns}")
          if notification_health.get("healthy") is not True:
              print(f"Notification warning: notification health is degraded: {notification_health}")
          print(json.dumps(summary, ensure_ascii=False, indent=2, default=str))
          if pending_notifications:
              latest_poll_created_at = latest_poll.get("created_at")
              pending_updated_at = []
              for pending in pending_notifications:
                  if not isinstance(pending, dict):
                      raise SystemExit(f"Pending notification must be an object: {pending!r}")
                  if pending.get("updated_at"):
                      pending_updated_at.append(pending.get("updated_at"))

              pending_rows_are_fresh = False
              active_poll_is_fresh = False
              now = datetime.now(timezone.utc)

              if latest_poll.get("status") in {"started", "running_past_request_timeout"} and latest_poll_created_at:
                  started_at = datetime.fromisoformat(
                      latest_poll_created_at.replace("Z", "+00:00")
                  )
                  if started_at.tzinfo is None:
                      started_at = started_at.replace(tzinfo=timezone.utc)
                  active_poll_is_fresh = (now - started_at).total_seconds() <= 20 * 60

              if pending_updated_at and len(pending_updated_at) == len(pending_notifications):
                  pending_rows_are_fresh = True
                  for updated_at in pending_updated_at:
                      parsed = datetime.fromisoformat(updated_at.replace("Z", "+00:00"))
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=timezone.utc)
                      if (now - parsed).total_seconds() > 20 * 60:
                          pending_rows_are_fresh = False
                          break

              if active_poll_is_fresh and pending_rows_are_fresh:
                  print(
                      "Pending notifications are fresh while a poll is still running; "
                      "treating this monitor check as healthy."
                  )
              else:
                  print(f"Notification warning: pending notifications remain: {pending_notifications}")
          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - name: Send failure alert
        if: failure()
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "No ALERT_WEBHOOK_URL configured; skipping failure alert"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "status": "failure",
              "context": os.environ.get("ALERT_CONTEXT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "job": os.environ.get("GITHUB_JOB"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "ref": os.environ.get("GITHUB_REF_NAME"),
              "sha": os.environ.get("GITHUB_SHA"),
              "url": (
                  f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}"
                  f"/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
              ),
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              os.environ["ALERT_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print(f"Alert webhook status: {response.status}")
          except Exception as exc:
              print(f"Alert webhook failed: {exc}")
          PY
