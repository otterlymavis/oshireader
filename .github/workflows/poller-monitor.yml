name: Poller monitor

on:
  schedule:
    # Run between Cloudflare's hourly cron ticks so completed polls have time to land.
    - cron: "12 * * * *"
  workflow_dispatch:

concurrency:
  group: poller-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_HEALTH_URL: https://oshireader-feed-poller.oshireader-otterlymavis.workers.dev/health
      BACKEND_STATS_URL: https://oshireader.onrender.com/api/admin/stats
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_CONTEXT: poller-monitor
    steps:
      - name: Check required secret
        run: |
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: ADMIN_API_TOKEN"
            exit 1
          fi

      - name: Check poller health
        run: |
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error \
            --output "$BODY" \
            --write-out "%{http_code}" \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 90 \
            "$WORKER_HEALTH_URL")

          echo "HTTP status: $STATUS"
          cat "$BODY"
          echo

          python3 - "$STATUS" "$BODY" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          status = sys.argv[1]
          with open(sys.argv[2], encoding="utf-8") as response_file:
              payload = json.load(response_file)

          diagnostics = payload.get("diagnostics") or {}
          latest_success = diagnostics.get("latest_successful_poll") or {}
          created_at = latest_success.get("created_at")
          if status != "200" or payload.get("status") != "ok" or payload.get("healthy") is not True:
              raise SystemExit(f"Poller health is degraded: {payload}")

          if not created_at:
              raise SystemExit(f"Missing latest_successful_poll timestamp: {payload}")

          completed = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
          if completed.tzinfo is None:
              completed = completed.replace(tzinfo=timezone.utc)
          age_minutes = (datetime.now(timezone.utc) - completed).total_seconds() / 60
          if age_minutes > 120:
              raise SystemExit(
                  f"Latest successful poll is too old: {age_minutes:.1f} minutes; payload={payload}"
              )

          latest_poll = diagnostics.get("latest_poll") or {}
          print(json.dumps({
              "healthy": True,
              "latest_successful_poll": latest_success,
              "latest_poll": latest_poll,
              "age_minutes": round(age_minutes, 1),
              "items_total": diagnostics.get("items_total"),
              "matches_total": diagnostics.get("matches_total"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Check backend notification health
        run: |
          BODY=$(mktemp)
          STATUS=$(curl --silent --show-error \
            --output "$BODY" \
            --write-out "%{http_code}" \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 30 \
            "$BACKEND_STATS_URL" \
            -H "Authorization: Bearer $ADMIN_API_TOKEN")

          echo "HTTP status: $STATUS"

          python3 - "$STATUS" "$BODY" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          status = sys.argv[1]
          with open(sys.argv[2], encoding="utf-8") as response_file:
              payload = json.load(response_file)

          apns = payload.get("apns") or {}
          notification_health = payload.get("notification_health") or {}
          pending_notifications = payload.get("pending_notifications") or []
          summary = {
              "apns_configured": apns.get("configured"),
              "apns_server_environment": apns.get("server_environment"),
              "device_tokens_by_environment_and_verification": apns.get(
                  "device_tokens_by_environment_and_verification", {}
              ),
              "notification_health": notification_health,
              "pending_notifications": pending_notifications,
              "latest_relevant_apns": payload.get("latest_relevant_apns"),
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2, default=str))

          failures = []
          if status != "200":
              failures.append(f"stats endpoint returned HTTP {status}")
          if apns.get("configured") is not True:
              failures.append("APNs is not configured")
          if notification_health.get("healthy") is not True:
              failures.append(f"notification health is degraded: {notification_health}")
          if pending_notifications:
              latest_poll = payload.get("latest_poll") or {}
              latest_poll_created_at = latest_poll.get("created_at")
              pending_updated_at = [
                  pending.get("updated_at")
                  for pending in pending_notifications
                  if pending.get("updated_at")
              ]

              active_poll_is_fresh = False
              pending_rows_are_fresh = False
              now = datetime.now(timezone.utc)

              if latest_poll.get("status") == "started" and latest_poll_created_at:
                  started_at = datetime.fromisoformat(
                      latest_poll_created_at.replace("Z", "+00:00")
                  )
                  if started_at.tzinfo is None:
                      started_at = started_at.replace(tzinfo=timezone.utc)
                  active_poll_is_fresh = (now - started_at).total_seconds() <= 20 * 60

              if pending_updated_at and len(pending_updated_at) == len(pending_notifications):
                  pending_rows_are_fresh = True
                  for updated_at in pending_updated_at:
                      parsed = datetime.fromisoformat(updated_at.replace("Z", "+00:00"))
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=timezone.utc)
                      if (now - parsed).total_seconds() > 20 * 60:
                          pending_rows_are_fresh = False
                          break

              if active_poll_is_fresh and pending_rows_are_fresh:
                  print(
                      "Pending notifications are fresh while a poll is still running; "
                      "treating this monitor check as healthy."
                  )
              else:
                  failures.append(f"pending notifications remain: {pending_notifications}")
          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - name: Send failure alert
        if: failure()
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "No ALERT_WEBHOOK_URL configured; skipping failure alert"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "status": "failure",
              "context": os.environ.get("ALERT_CONTEXT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "job": os.environ.get("GITHUB_JOB"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "ref": os.environ.get("GITHUB_REF_NAME"),
              "sha": os.environ.get("GITHUB_SHA"),
              "url": (
                  f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}"
                  f"/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
              ),
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              os.environ["ALERT_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print(f"Alert webhook status: {response.status}")
          except Exception as exc:
              print(f"Alert webhook failed: {exc}")
          PY
