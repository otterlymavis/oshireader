name: OshiReader
options:
  bundleIdPrefix: com.otterlymavis
configs:
  Debug: debug
  Staging: release
  Release: release
targets:
  OshiReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReader
    dependencies:
      - target: OshiReaderNotificationService
        embed: true
      - target: OshiReaderNotificationContent
        embed: true
    settings:
      base:
        INFOPLIST_FILE: OshiReader/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.oshireader.plus
        PRODUCT_NAME: OshiReader
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OshiReader/OshiReader.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 29
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        OSHIREADER_API_BASE_URL: https://oshireader.onrender.com
        OSHIREADER_ENVIRONMENT: Production
      configs:
        Debug:
          OSHIREADER_API_BASE_URL: https://oshireader.onrender.com
          OSHIREADER_ENVIRONMENT: Development
          APNS_ENVIRONMENT: development
          ENABLE_TESTABILITY: YES
        Staging:
          OSHIREADER_API_BASE_URL: https://oshireader.onrender.com
          OSHIREADER_ENVIRONMENT: Staging
          APNS_ENVIRONMENT: production
          ENABLE_TESTABILITY: YES
        Release:
          OSHIREADER_API_BASE_URL: https://oshireader.onrender.com
          OSHIREADER_ENVIRONMENT: Production
          APNS_ENVIRONMENT: production
  OshiReaderNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderNotificationService
    dependencies:
      - sdk: UserNotifications.framework
    settings:
      base:
        INFOPLIST_FILE: OshiReaderNotificationService/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.oshireader.plus.NotificationService
        PRODUCT_NAME: OshiReaderNotificationService
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_DEBUG_DYLIB: NO
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 29
        TARGETED_DEVICE_FAMILY: "1,2"
  OshiReaderNotificationContent:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderNotificationContent
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        INFOPLIST_FILE: OshiReaderNotificationContent/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.oshireader.plus.NotificationContent
        PRODUCT_NAME: OshiReaderNotificationContent
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_DEBUG_DYLIB: NO
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 29
        TARGETED_DEVICE_FAMILY: "1,2"
  OshiReaderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderTests
    dependencies:
      - target: OshiReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
  OshiReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderUITests
    dependencies:
      - target: OshiReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.otterlymavis.OshiReaderUITests
        DEVELOPMENT_TEAM: D8H3TBWH7P
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic

schemes:
  OshiReader:
    build:
      targets:
        OshiReader: [run, test, profile, analyze]
    test:
      targets:
        - OshiReaderTests
        - OshiReaderUITests
      config: Debug
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  OshiReader Local:
    build:
      targets:
        OshiReader: [run, test, profile, analyze]
    test:
      targets:
        - OshiReaderTests
        - OshiReaderUITests
      config: Debug
    run:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug
  OshiReader Staging:
    build:
      targets:
        OshiReader: [run, test, profile, analyze]
    test:
      targets:
        - OshiReaderTests
        - OshiReaderUITests
      config: Staging
      environmentVariables:
        OSHI_READER_RUN_LIVE_UI_TESTS: "1"
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
  OshiReader Production:
    build:
      targets:
        OshiReader: [run, test, profile, analyze, archive]
    test:
      targets:
        - OshiReaderTests
        - OshiReaderUITests
      config: Debug
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
