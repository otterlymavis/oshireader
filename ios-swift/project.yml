name: OshiReader
options:
  bundleIdPrefix: com.otterlymavis
targets:
  OshiReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReader
    settings:
      base:
        INFOPLIST_FILE: OshiReader/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.otterpia.oshireader
        PRODUCT_NAME: OshiReader
        DEVELOPMENT_TEAM: HX8V73S8BL
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  OshiReaderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderTests
    dependencies:
      - target: OshiReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OshiReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OshiReaderUITests
    dependencies:
      - target: OshiReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.otterlymavis.OshiReaderUITests

schemes:
  OshiReader:
    build:
      targets:
        OshiReader: [run, test, profile, analyze]
    test:
      targets:
        - OshiReaderTests
        - OshiReaderUITests
