services:
  - type: web
    name: oshireader
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "15"
      - key: CONNECTOR_CONCURRENCY
        value: "4"
      - key: BACKEND_PUBLIC_URL
        value: https://oshireader.onrender.com
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_TOPIC
        value: com.otterpia.oshireader.plus
      - key: APNS_USE_SANDBOX
        value: "false"
      - key: CORS_ALLOW_ORIGINS
        sync: false
