services:
  - type: web
    name: oshireader
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: INTERNAL_SCHEDULER_ENABLED
        value: "true"
      - key: POLL_INTERVAL_MINUTES
        value: "15"
      - key: CONNECTOR_FETCH_TIMEOUT_SECONDS
        value: "25"
      - key: CONNECTOR_CONCURRENCY
        value: "1"
      - key: POLL_TERMS_PER_RUN
        value: "2"
      - key: REFRESH_FREE_INTERVAL_MINUTES
        value: "180"
      - key: REFRESH_STANDARD_INTERVAL_MINUTES
        value: "360"
      - key: REFRESH_PREMIUM_INTERVAL_MINUTES
        value: "180"
      - key: INACTIVE_POLL_AFTER_DAYS
        value: "30"
      - key: RETENTION_DAYS
        value: "30"
      - key: NOTIFICATION_FRESHNESS_WINDOW_MINUTES
        value: "120"
      - key: ORPHANED_NOTIFICATION_GRACE_MINUTES
        value: "60"
      - key: PENDING_NOTIFICATION_STALE_AFTER_DAYS
        value: "7"
      - key: BACKEND_PUBLIC_URL
        value: https://oshireader.onrender.com
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_TOPIC
        value: com.otterpia.oshireader.plus
      - key: APNS_USE_SANDBOX
        value: "false"
      - key: CORS_ALLOW_ORIGINS
        sync: false
